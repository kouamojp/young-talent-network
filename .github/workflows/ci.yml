name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Typage, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typage TypeScript
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      # Le code existant contient encore de nombreux `any` signalés par ESLint :
      # le lint est informatif tant qu'ils ne sont pas corrigés.
      - name: Lint (informatif)
        run: npm run lint
        continue-on-error: true
